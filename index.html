<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TUH EP</title>
    <style>
                :root {
            --bg-color: #ffffff;
            --accent-color: #e95500;
            --lane-color: #ffee9b;
            --text-color: #adc642;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* MENU UTAMA */
       #main-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 16px;
    padding: 20px;
    margin: 0 auto;
    max-width: 400px;
    position: relative;
    z-index: 1;
}

.logo-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    pointer-events: none; /* Mencegah logo menghalangi klik ke tombol di sekitarnya */
}

.custom-logo-img {
    width: 160px !important;
    max-width: 50vw !important;
    height: auto !important;
    max-height: 160px !important;
    object-fit: contain !important;
    display: block !important;
    pointer-events: none; /* Logo tidak akan merespons atau menghalangi klik */
}

.btn {
    width: 200px;
    padding: 16px;
    border: none;
    border-radius: 30px;
    background: var(--text-color);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    cursor: pointer;
    position: relative;
    z-index: 10; /* Memastikan tombol selalu berada di lapisan paling atas */
}

        /* LEADERBOARD MODAL */
        #leaderboard-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            z-index: 100;
        }

        .lb-list {
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            margin-bottom: 8px;
            background: #f8f8fc;
            border-radius: 15px;
            font-weight: 600;
        }

        /* IN-GAME DISPLAY */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #hud {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            font-size: 22px;
            font-weight: 800;
            z-index: 10;
        }

        #judgment-text {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            opacity: 0;
            transition: transform 0.1s ease, opacity 0.2s ease;
            z-index: 10;
        }

        /* LANES & HEART KEYS */
        .lanes-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            height: 100%;
            padding: 0 10px;
        }

        .lane {
            flex: 1;
            max-width: 80px;
            height: 100%;
            background: rgba(240, 240, 245, 0.4);
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 40px;
            overflow: hidden;
        }

        .heart-key {
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            display: inline-block;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 6px 15px rgba(255, 94, 151, 0.4);
            z-index: 6;
        }

        .heart-key::before, .heart-key::after {
            content: "";
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            border-radius: 50%;
            position: absolute;
        }

        .heart-key::before { top: -25px; left: 0; }
        .heart-key::after { left: 25px; top: 0; }

        /* ANIMASI NOTE JATUH */
        .note {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff5e97, #ff9a9e);
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(255, 94, 151, 0.5);
            z-index: 5;
            animation: fall 1s linear forwards;
        }

        @keyframes fall {
            0% { top: -60px; opacity: 1; }
            100% { top: calc(100% - 90px); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- MENU UTAMA -->

    <div class="logo-wrapper">
        <img src="logo.png" alt="Logo Game" class="custom-logo-img">
    </div>
    <button class="btn" onclick="startGame()">PLAY</button>
    <button class="btn btn-secondary" onclick="toggleLeaderboard(true)">LEADERBOARD</button>
</div>
    
    <!-- GLOBAL LEADERBOARD -->
    <div id="leaderboard-modal">
        <h2>Global Leaderboard</h2>
        <div class="lb-list">
            <div class="lb-item"><span>1. GenZ_King</span><span>985,000</span></div>
            <div class="lb-item"><span>2. Aesthetic2004</span><span>942,100</span></div>
            <div class="lb-item"><span>3. RhythmGod</span><span>910,500</span></div>
        </div>
        <button class="btn btn-secondary" style="margin-top: 20px;" onclick="toggleLeaderboard(false)">CLOSE</button>
    </div>

    <!-- IN-GAME SCREEN -->
    <div id="game-screen">
        <div id="hud">
            <span id="score-display">000000</span>
            <span id="combo-display">0x</span>
        </div>
        <div id="judgment-text">PERFECT</div>

        <div class="lanes-container">
            <div class="lane" id="lane-0" ontouchstart="hitLane(0)" onclick="hitLane(0)"><div class="heart-key"></div></div>
            <div class="lane" id="lane-1" ontouchstart="hitLane(1)" onclick="hitLane(1)"><div class="heart-key"></div></div>
            <div class="lane" id="lane-2" ontouchstart="hitLane(2)" onclick="hitLane(2)"><div class="heart-key"></div></div>
            <div class="lane" id="lane-3" ontouchstart="hitLane(3)" onclick="hitLane(3)"><div class="heart-key"></div></div>
        </div>
    </div>

    <!-- JAVASCRIPT LANGSUNG DI DALAM FILE HTML (TANPA SCRIPT.JS) -->
    <script>
        // Inisialisasi Audio (Pastikan file music.mp3 ada di folder yang sama)
        const bgm = new Audio('music.mp3');

        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let beatmapData = [];

        // Memuat file beatmap.json secara langsung
        fetch('beatmap.json')
            .then(res => res.json())
            .then(data => { 
                beatmapData = data.beatmap; 
            })
            .catch(err => console.log("Catatan: Pastikan jalankan lewat Live Server agar fetch JSON terbaca."));

        function toggleLeaderboard(show) {
            document.getElementById('leaderboard-modal').style.display = show ? 'flex' : 'none';
        }

        function startGame() {
            // Reset status note agar bisa dimainkan ulang dari awal
            beatmapData.forEach(note => note.spawned = false);

            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            score = 0;
            combo = 0;
            isPlaying = true;
            updateHUD();

            // Putar musik saat tombol play ditekan
            bgm.currentTime = 0;
            bgm.play().then(() => {
                requestAnimationFrame(gameLoop);
            }).catch(error => {
                alert("Gagal memutar audio! Pastikan file 'music.mp3' ada di folder yang sama.");
            });
        }

        function gameLoop() {
            if (!isPlaying) return;

            const currentTimeMs = bgm.currentTime * 1000;

            // Memunculkan note 1 detik sebelum timestamp lagunya tiba
            beatmapData.forEach((note) => {
                if (!note.spawned && currentTimeMs >= (note.timestamp - 1000)) { 
                    spawnNote(note);
                    note.spawned = true; 
                }
            });

            if (bgm.ended) {
                endGame();
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        function spawnNote(noteData) {
            const laneElement = document.getElementById(`lane-${noteData.lane}`);
            if (!laneElement) return;

            const noteEl = document.createElement('div');
            noteEl.className = 'note';
            laneElement.appendChild(noteEl);

            // Hapus elemen note otomatis setelah animasi jatuh selesai (1 detik)
            setTimeout(() => {
                noteEl.remove();
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            alert(`Game Selesai! Skor Akhir Anda: ${score}`);
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score.toString().padStart(6, '0');
            document.getElementById('combo-display').innerText = combo + 'x';
        }

        function hitLane(laneIndex) {
            if (!isPlaying) return;

            const judgments = ['PERFECT', 'GOOD', 'MISS'];
            const rand = Math.random();
            let result = rand < 0.6 ? 'PERFECT' : (rand < 0.9 ? 'GOOD' : 'MISS');

            triggerJudgment(result);
        }

        function triggerJudgment(type) {
            const el = document.getElementById('judgment-text');
            el.innerText = type;
            el.style.opacity = '1';
            
            if (type === 'PERFECT') {
                el.style.color = '#ff5e97';
                score += 1000;
                combo++;
            } else if (type === 'GOOD') {
                el.style.color = '#ffb800';
                score += 500;
                combo++;
            } else {
                el.style.color = '#888888';
                combo = 0;
            }

            updateHUD();
            setTimeout(() => { el.style.opacity = '0'; }, 300);
        }

// 2. Fungsi Mengambil Data Leaderboard Real-time dari Firebase
function loadLeaderboard() {
    const lbContainer = document.querySelector('.lb-list');
    lbContainer.innerHTML = '<p style="text-align:center;">Loading...</p>';

    // Ambil Top 10 Skor Tertinggi
    db.ref('leaderboard')
      .orderByChild('score')
      .limitToLast(10)
      .on('value', (snapshot) => {
          lbContainer.innerHTML = '';
          let players = [];

          snapshot.forEach((childSnapshot) => {
              players.push(childSnapshot.val());
          });

          // Urutkan dari skor terbesar ke terkecil
          players.reverse();

          if (players.length === 0) {
              lbContainer.innerHTML = '<p style="text-align:center;">Belum ada skor.</p>';
              return;
          }

          players.forEach((player, index) => {
              const item = document.createElement('div');
              item.className = 'lb-item';
              item.innerHTML = `<span>${index + 1}. ${player.username}</span><span>${player.score.toLocaleString()}</span>`;
              lbContainer.appendChild(item);
          });
      });
}

function toggleLeaderboard(show) {
    document.getElementById('leaderboard-modal').style.display = show ? 'flex' : 'none';
    if (show) loadLeaderboard(); // Muat data dari server saat modal dibuka
}

function startGame() {
    beatmapData.forEach(note => note.spawned = false);
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    
    score = 0;
    combo = 0;
    isPlaying = true;
    updateHUD();

    bgm.currentTime = 0;
    bgm.play().then(() => {
        requestAnimationFrame(gameLoop);
    });
}

function gameLoop() {
    if (!isPlaying) return;

    const currentTimeMs = bgm.currentTime * 1000;
    beatmapData.forEach((note) => {
        if (!note.spawned && currentTimeMs >= (note.timestamp - 1000)) { 
            spawnNote(note);
            note.spawned = true; 
        }
    });

    if (bgm.ended) {
        endGame();
    } else {
        requestAnimationFrame(gameLoop);
    }
}

function spawnNote(noteData) {
    const laneElement = document.getElementById(`lane-${noteData.lane}`);
    if (!laneElement) return;

    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    laneElement.appendChild(noteEl);

    setTimeout(() => { noteEl.remove(); }, 1000);
}

// 3. Fungsi Menyimpan Skor ke Firebase saat Game Selesai
function endGame() {
    isPlaying = false;
    
    // Minta masukan Username Gen-Z pemain
    setTimeout(() => {
        const username = prompt(`Game Over! Skor Anda: ${score}\nMasukkan Nama/Username Anda:`) || "Anonymous";

        // Simpan data ke Firebase Database
        db.ref('leaderboard').push({
            username: username,
            score: score,
            timestamp: Date.now()
        }).then(() => {
            toggleLeaderboard(true); // Buka leaderboard setelah upload
        });

        document.getElementById('main-menu').style.display = 'flex';
        document.getElementById('game-screen').style.display = 'none';
    }, 500);
}

function updateHUD() {
    document.getElementById('score-display').innerText = score.toString().padStart(6, '0');
    document.getElementById('combo-display').innerText = combo + 'x';
}

function hitLane(laneIndex) {
    if (!isPlaying) return;

    const rand = Math.random();
    let result = rand < 0.6 ? 'PERFECT' : (rand < 0.9 ? 'GOOD' : 'MISS');

    triggerJudgment(result);
}

function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    el.innerText = type;
    el.style.opacity = '1';
    
    if (type === 'PERFECT') {
        el.style.color = '#ff5e97';
        score += 1000;
        combo++;
    } else if (type === 'GOOD') {
        el.style.color = '#ffb800';
        score += 500;
        combo++;
    } else {
        el.style.color = '#888888';
        combo = 0;
    }

    updateHUD();
    setTimeout(() => { el.style.opacity = '0'; }, 300);
}

    .then(res => res.json())
    .then(data => { beatmapData = data.beatmap; });
