        .heart-key {
            width: 50px;
            height: 50px;

            display: inline-block;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 6px 15px rgba(255, 94, 151, 0.4);
            z-index: 6;
        }

        .heart-key::before, .heart-key::after {
            content: "";
            width: 50px;
            height: 50px;
            background-color: var(--accent-color);
            border-radius: 50%;
            position: absolute;
        }

        .heart-key::before { top: -25px; left: 0; }
        .heart-key::after { left: 25px; top: 0; }

        .note {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff5e97, #ff9a9e);
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);

            z-index: 5;

        }

        @keyframes fall {
            0% { top: -60px; opacity: 1; }

        function toggleLeaderboard(show) {
            document.getElementById('leaderboard-modal').style.display = show ? 'flex' : 'none';
            if (show) loadLeaderboard();
        }

        function loadLeaderboard() {
            const lbContainer = document.querySelector('.lb-list');
            lbContainer.innerHTML = '<p style="text-align:center;">Loading...</p>';

            try {
                firebase.database().ref('leaderboard')
                  .orderByChild('score')
                  .limitToLast(10)
                  .on('value', (snapshot) => {
                      lbContainer.innerHTML = '';
                      let players = [];
                      snapshot.forEach((childSnapshot) => { players.push(childSnapshot.val()); });
                      players.reverse();

                      if (players.length === 0) {
                          lbContainer.innerHTML = '<p style="text-align:center;">Belum ada skor.</p>';
                          return;
                      }

                      players.forEach((player, index) => {
                          const item = document.createElement('div');
                          item.className = 'lb-item';
                          item.innerHTML = `<span>${index + 1}. ${player.username}</span><span>${player.score.toLocaleString()}</span>`;
                          lbContainer.appendChild(item);
                      });
                  });
            } catch (err) {
                lbContainer.innerHTML = '<p style="text-align:center;">Firebase belum terhubung.</p>';
            }
        }

        function gameLoop(timestamp) {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawLanes();

    const currentTime = bgm.currentTime * 1000; // milidetik

    // 1. Spawn Note Baru
    beatmapData.forEach(note => {
        if (!note.spawned && currentTime >= note.timestamp - 1500) {
            notes.push({
                lane: note.lane,
                targetTime: note.timestamp,
                y: 0,
                hit: false
            });
            note.spawned = true;
        }
    });

    // 2. Update & Draw Note
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        
        // Hitung posisi Y berdasarkan waktu
        const timeDiff = note.targetTime - currentTime;
        note.y = hitLineY - (timeDiff * noteSpeed);

       // Di dalam gameLoop(): Cek jika note sudah melewahi batas bawah layar (Auto MISS)
const allNotes = document.querySelectorAll('.note');
allNotes.forEach(note => {
    const rect = note.getBoundingClientRect();
    // Jika posisi note sudah melewati batas bawah layar HP/canvas
    if (rect.top > window.innerHeight - 50) {
        note.remove(); // Hapus dari DOM
        triggerJudgment('MISS');
    }
});

        // Gambar Note yang aktif
        if (!note.hit && note.y >= 0 && note.y <= canvas.height) {
            drawNote(note.lane, note.y);
        }
    }

    // 3. Cek Penutupan Lagu jika Audio Berakhir
    if (bgm.ended) {
        endGame();
        return;
    }

    requestAnimationFrame(gameLoop);
}

        function spawnNote(noteData) {

            noteEl.className = 'note';
            laneElement.appendChild(noteEl);

            setTimeout(() => { noteEl.remove(); }, 1000);
        }

        function endGame() {
            isPlaying = false;
            const username = prompt(`Game Over! Skor Anda: ${score}\nMasukkan Nama/Username Anda:`) || "Anonymous";

            try {
                firebase.database().ref('leaderboard').push({

                    score: score,
                    timestamp: Date.now()

                });
            } catch(e) {

            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';

        function updateHUD() {
            document.getElementById('score-display').innerText = score.toString().padStart(6, '0');
            document.getElementById('combo-display').innerText = combo + 'x';
        }

        function hitLane(laneIndex) {
    if (!isPlaying) return;

    // 1. Ambil jalur/lane yang ditekan (0, 1, 2, atau 3)
    const lanes = document.querySelectorAll('.lane');
    const currentLane = lanes[laneIndex];
    if (!currentLane) return;

    // 2. Cari semua note yang sedang meluncur di jalur ini
    const activeNotes = currentLane.querySelectorAll('.note');

    // Jika pencet tapi tidak ada note di jalur tersebut = MISS
    if (activeNotes.length === 0) {
        triggerJudgment('MISS');
        return;
    }

    // 3. Ambil note paling bawah (paling dekat tombol) & tombol hatinya
    const targetNote = activeNotes[0];
    const heartKey = currentLane.querySelector('.heart-key');

    if (!targetNote || !heartKey) return;

    // 4. Hitung jarak piksel antara note dan tombol hati
    const noteRect = targetNote.getBoundingClientRect();
    const heartRect = heartKey.getBoundingClientRect();

    const noteCenter = noteRect.top + (noteRect.height / 2);
    const heartCenter = heartRect.top + (heartRect.height / 2);
    const distance = Math.abs(noteCenter - heartCenter);

    // 5. Penilaian berdasarkan jarak (dalam piksel)
    if (distance <= 45) {
        targetNote.remove(); // Hapus note yang berhasil ditekan
        triggerJudgment('PERFECT');
    } else if (distance <= 90) {
        targetNote.remove();
        triggerJudgment('GOOD');
    } else {
        targetNote.remove();
        triggerJudgment('MISS');
    }
}
      function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    el.innerText = type;
    el.style.opacity = '1';
    
    if (type === 'PERFECT') {
        el.style.color = '#ff5e97';
        score += 1000;
        combo++;
        perfectCount++;
    } else if (type === 'GOOD') {
        el.style.color = '#ffb800';
        score += 500;
        combo++;
        goodCount++;
    } else { // MISS
        el.style.color = '#888888';
        combo = 0;
        missCount++;

        // --- CEK BATAS MAXIMUM MISS (GAME OVER) ---
        if (missCount >= 5) {
            bgm.pause(); // Hentikan musik
            endGame();   // Buka layar Game Over / Result Screen
            return;
        }
    }

    updateHUD();
    setTimeout(() => { el.style.opacity = '0'; }, 300);
}

let perfectCount = 0;

let missCount = 0;

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    
    // Reset hitungan
    score = 0;
    combo = 0;
    perfectCount = 0;
    goodCount = 0;
    missCount = 0;
    
    isPlaying = true;
    beatmapData.forEach(note => note.spawned = false);
    updateHUD();

    bgm.currentTime = 0;
    bgm.play().then(() => {
        requestAnimationFrame(gameLoop);
    }).catch(err => {
        requestAnimationFrame(gameLoop);
    });
}

function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    el.innerText = type;
    el.style.opacity = '1';
    
    // Hitung statistik penilaian
    if (type === 'PERFECT') {
        el.style.color = '#ff5e97';
        score += 1000;
        combo++;
        perfectCount++;
    } else if (type === 'GOOD') {
        el.style.color = '#ffb800';
        score += 500;
        combo++;
        goodCount++;
    } else {
        el.style.color = '#888888';
        combo = 0;
        missCount++;
    }

    updateHUD();
    setTimeout(() => { el.style.opacity = '0'; }, 300);
}

// Menyimpan ke Firebase menggunakan input kustom dari UI
function saveScoreAndExit() {
    const inputVal = document.getElementById('username-input').value.trim();
    const username = inputVal !== "" ? inputVal : "Player";

    const submitBtn = document.querySelector('#result-screen .btn');
    submitBtn.innerText = "SAVING...";
    submitBtn.disabled = true;

    // Simpan ke Firebase Realtime Database
    try {
        firebase.database().ref('leaderboard').push({
            username: username,
            score: score,
            perfect: perfectCount,
            good: goodCount,
            miss: missCount,
            timestamp: Date.now()
        }).then(() => {
            submitBtn.innerText = "SUBMIT SCORE";
            submitBtn.disabled = false;
            document.getElementById('result-screen').style.display = 'none';
            toggleLeaderboard(true); // Langsung buka halaman leaderboard
        }).catch(() => {
            fallbackExit(submitBtn);
        });
    } catch(e) {
        fallbackExit(submitBtn);
    }
}

function fallbackExit(btn) {
    btn.innerText = "SUBMIT SCORE";
    btn.disabled = false;
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}
