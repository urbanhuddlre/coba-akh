<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUH EP</title>
    
    <!-- Firebase App & Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --accent-color: #e95500;
            --bg-color: #f6f6f9;
            --text-color: #adc642;
            --lane-color: #ffee9b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* LOGO STYLING */
        .game-logo {
            width: 140px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(255, 94, 151, 0.3));
        }

        .result-logo {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        /* UI SCREENS */
        #main-menu, #result-screen, #leaderboard-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* BUTTONS & UI */
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 94, 151, 0.3);
            transition: transform 0.1s;
            margin: 8px 0;
            width: 80%;
            max-width: 250px;
            text-align: center;
        }

        .btn:active { transform: scale(0.95); }

        /* HUD */
        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            z-index: 10;
        }

        #judgment-text {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 10;
            pointer-events: none;
        }

        /* GAME PLAY AREA */
        .track-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .lane {
            flex: 1;
            border-right: 1px dashed #eee;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        .lane:last-child { border-right: none; }

        .heart-key {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-color);
            background: white;
            box-shadow: 0 4px 10px rgba(255, 94, 151, 0.2);
        }

        .heart-key:active {
            background: var(--accent-color);
            color: white;
        }

        /* NOTE ANIMATION */
        .note {
            position: absolute;
            width: 36px;
            height: 36px;
            left: calc(50% - 18px);
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 94, 151, 0.5);
            animation: fall 1.5s linear forwards;
        }

        @keyframes fall {
            0% { top: -40px; }
            100% { top: 100%; }
        }

        /* RESULT SCREEN UI */
        .result-box {
            background: #ffffff;
            border: 2px solid #f0f0f5;
            padding: 30px 24px;
            border-radius: 30px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 94, 151, 0.15);
        }

        .score-big {
            font-size: 36px;
            font-weight: 900;
            margin: 5px 0 15px 0;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat-pill {
            flex: 1;
            padding: 10px 4px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 800;
            background: #f8f8fc;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-pill span { font-size: 18px; }
        .stat-pill.perfect { color: #ff5e97; }
        .stat-pill.good { color: #ffb800; }
        .stat-pill.miss { color: #888888; }

        #username-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f0f0f5;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            background: #f8f8fc;
            margin-bottom: 15px;
        }

        #username-input:focus {
            border-color: var(--accent-color);
            background: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- AUDIO BGM -->
    <audio id="bgm" src="music.mp3" preload="auto"></audio>

    <!-- 1. MAIN MENU -->
    <div id="main-menu">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Logo Game" class="logo.png">
        </div>
        <h1 style="color: var(--accent-color); font-size: 32px; margin-bottom: 30px;">TUH EP</h1>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
        <button class="btn" style="background:#eee; color:#555;" onclick="toggleLeaderboard(true)">LEADERBOARD</button>
    </div>

    <!-- 2. GAME PLAY SCREEN -->
    <div id="game-screen">
        <div class="hud">
            <div>SCORE: <span id="score">0</span></div>
            <div>COMBO: <span id="combo">0</span></div>
        </div>

        <div id="judgment-text">PERFECT</div>

        <div class="track-container">
            <div class="lane" onclick="hitLane(0)"><div class="heart-key">♥</div></div>
            <div class="lane" onclick="hitLane(1)"><div class="heart-key">♥</div></div>
            <div class="lane" onclick="hitLane(2)"><div class="heart-key">♥</div></div>
            <div class="lane" onclick="hitLane(3)"><div class="heart-key">♥</div></div>
        </div>
    </div>

    <!-- 3. RESULT SCREEN (GAME OVER) -->
    <div id="result-screen" style="display: none;">
        <div class="result-box">
            <h2 style="margin: 0; color: var(--accent-color);">GAME OVER</h2>
            <div style="font-size: 12px; font-weight:800; color:#888; margin-top:10px;">TOTAL SCORE</div>
            <div id="res-score" class="score-big">0</div>

            <div class="stats-container">
                <div class="stat-pill perfect">PERFECT <span id="res-perfect">0</span></div>
                <div class="stat-pill good">GOOD <span id="res-good">0</span></div>
                <div class="stat-pill miss">MISS <span id="res-miss">0</span></div>
            </div>

            <input type="text" id="username-input" placeholder="Masukkan Nama Kamu..." maxlength="12">
            <button class="btn" onclick="saveScoreAndExit()">SUBMIT SCORE</button>
        </div>
    </div>

    <!-- 4. LEADERBOARD MODAL -->
    <div id="leaderboard-modal" style="display: none;">
        <h2>LEADERBOARD</h2>
        <div id="leaderboard-list" style="width:100%; max-height:300px; overflow-y:auto; margin: 20px 0;">
            <p style="text-align:center;">Loading...</p>
        </div>
        <button class="btn" onclick="toggleLeaderboard(false)">KEMBALI</button>
    </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD8sLyanphP9Y2ZY8MWmDpsBBOcCegMW08",
  authDomain: "urbanhudlde.firebaseapp.com",
  projectId: "urbanhudlde",
  storageBucket: "urbanhudlde.firebasestorage.app",
  messagingSenderId: "992493553966",
  appId: "1:992493553966:web:7440d47c1797356c8092bf",
  measurementId: "G-K3NS4CWZHR"
};

// --- VARIABEL GAME ---
let score = 0;
let combo = 0;
let isPlaying = false;
let gameInterval = null;

let perfectCount = 0;
let goodCount = 0;
let missCount = 0;

const bgm = document.getElementById('bgm');

// --- DATA BEATMAP (52 DETIK) ---
let beatmapData = [
  { timestamp: 500, lane: 0 }, { timestamp: 800, lane: 1 }, { timestamp: 1100, lane: 2 }, { timestamp: 1400, lane: 3 },
  { timestamp: 2000, lane: 1 }, { timestamp: 2300, lane: 2 }, { timestamp: 2600, lane: 0 }, { timestamp: 2900, lane: 3 },
  { timestamp: 3500, lane: 0 }, { timestamp: 3800, lane: 1 }, { timestamp: 4100, lane: 2 }, { timestamp: 4400, lane: 3 },
  { timestamp: 5000, lane: 2 }, { timestamp: 5300, lane: 1 }, { timestamp: 5900, lane: 0 }, { timestamp: 6200, lane: 2 },
  { timestamp: 6500, lane: 1 }, { timestamp: 6800, lane: 3 }, { timestamp: 7400, lane: 0 }, { timestamp: 7700, lane: 3 },
  { timestamp: 8300, lane: 1 }, { timestamp: 8600, lane: 2 }, { timestamp: 8900, lane: 1 }, { timestamp: 9200, lane: 2 },
  { timestamp: 9800, lane: 0 }, { timestamp: 10100, lane: 3 }, { timestamp: 10400, lane: 1 }, { timestamp: 10700, lane: 2 },
  { timestamp: 11000, lane: 0 }, { timestamp: 11600, lane: 1 }, { timestamp: 11900, lane: 3 }, { timestamp: 12200, lane: 2 },
  { timestamp: 12500, lane: 0 }, { timestamp: 13100, lane: 1 }, { timestamp: 13400, lane: 2 }, { timestamp: 13700, lane: 3 },
  { timestamp: 14300, lane: 0 }, { timestamp: 14600, lane: 1 }, { timestamp: 14900, lane: 2 }, { timestamp: 15200, lane: 3 },
  { timestamp: 15800, lane: 2 }, { timestamp: 16100, lane: 1 }, { timestamp: 16400, lane: 0 }, { timestamp: 17000, lane: 3 },
  { timestamp: 17300, lane: 2 }, { timestamp: 17600, lane: 1 }, { timestamp: 18200, lane: 0 }, { timestamp: 18500, lane: 1 },
  { timestamp: 18800, lane: 2 }, { timestamp: 19100, lane: 3 }, { timestamp: 19700, lane: 2 }, { timestamp: 20000, lane: 1 },
  { timestamp: 20300, lane: 0 }, { timestamp: 20900, lane: 1 }, { timestamp: 21200, lane: 2 }, { timestamp: 21500, lane: 3 },
  { timestamp: 22100, lane: 0 }, { timestamp: 22400, lane: 2 }, { timestamp: 22700, lane: 1 }, { timestamp: 23000, lane: 3 },
  { timestamp: 23600, lane: 0 }, { timestamp: 23900, lane: 1 }, { timestamp: 24200, lane: 2 }, { timestamp: 24500, lane: 3 },
  { timestamp: 25100, lane: 2 }, { timestamp: 25400, lane: 1 }, { timestamp: 25700, lane: 0 }, { timestamp: 26300, lane: 3 },
  { timestamp: 26600, lane: 2 }, { timestamp: 26900, lane: 1 }, { timestamp: 27500, lane: 0 }, { timestamp: 27800, lane: 1 },
  { timestamp: 28100, lane: 2 }, { timestamp: 28400, lane: 3 }, { timestamp: 29000, lane: 2 }, { timestamp: 29300, lane: 1 },
  { timestamp: 29600, lane: 0 }, { timestamp: 30200, lane: 1 }, { timestamp: 30500, lane: 2 }, { timestamp: 30800, lane: 3 },
  { timestamp: 31400, lane: 0 }, { timestamp: 31700, lane: 2 }, { timestamp: 32000, lane: 1 }, { timestamp: 32300, lane: 3 },
  { timestamp: 32900, lane: 0 }, { timestamp: 33200, lane: 1 }, { timestamp: 33500, lane: 2 }, { timestamp: 33800, lane: 3 },
  { timestamp: 34400, lane: 2 }, { timestamp: 34700, lane: 1 }, { timestamp: 35000, lane: 0 }, { timestamp: 35600, lane: 3 },
  { timestamp: 35900, lane: 2 }, { timestamp: 36200, lane: 1 }, { timestamp: 36800, lane: 0 }, { timestamp: 37100, lane: 1 },
  { timestamp: 37400, lane: 2 }, { timestamp: 37700, lane: 3 }, { timestamp: 38300, lane: 2 }, { timestamp: 38600, lane: 1 },
  { timestamp: 38900, lane: 0 }, { timestamp: 39500, lane: 1 }, { timestamp: 39800, lane: 2 }, { timestamp: 40100, lane: 3 },
  { timestamp: 40700, lane: 0 }, { timestamp: 41000, lane: 2 }, { timestamp: 41300, lane: 1 }, { timestamp: 41600, lane: 3 },
  { timestamp: 42200, lane: 0 }, { timestamp: 42500, lane: 1 }, { timestamp: 42800, lane: 2 }, { timestamp: 43100, lane: 3 },
  { timestamp: 43700, lane: 2 }, { timestamp: 44000, lane: 1 }, { timestamp: 44300, lane: 0 }, { timestamp: 44900, lane: 3 },
  { timestamp: 45200, lane: 2 }, { timestamp: 45500, lane: 1 }, { timestamp: 46100, lane: 0 }, { timestamp: 46400, lane: 1 },
  { timestamp: 46700, lane: 2 }, { timestamp: 47000, lane: 3 }, { timestamp: 47600, lane: 2 }, { timestamp: 47900, lane: 1 },
  { timestamp: 48200, lane: 0 }, { timestamp: 48800, lane: 1 }, { timestamp: 49100, lane: 2 }, { timestamp: 49400, lane: 3 },
  { timestamp: 50000, lane: 0 }, { timestamp: 50500, lane: 1 }, { timestamp: 51000, lane: 2 }
];

// --- MULAI PERMAINAN ---
function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    
    score = 0;
    combo = 0;
    perfectCount = 0;
    goodCount = 0;
    missCount = 0;
    
    document.querySelectorAll('.note').forEach(n => n.remove());
    beatmapData.forEach(n => n.spawned = false);

    isPlaying = true;
    updateHUD();

    bgm.currentTime = 0;
    bgm.play().catch(() => {});

    if (gameInterval) clearInterval(gameInterval);
    const startTime = Date.now();

    gameInterval = setInterval(() => {
        if (!isPlaying) return;

        const elapsedTime = Date.now() - startTime;

        // Spawn Note sesuai timestamp
        beatmapData.forEach(note => {
            if (!note.spawned && elapsedTime >= note.timestamp) {
                spawnNoteDOM(note.lane);
                note.spawned = true;
            }
        });

        // Cek Note yang lolos lewat bawah (AUTO MISS)
        document.querySelectorAll('.note').forEach(noteEl => {
            const rect = noteEl.getBoundingClientRect();
            if (rect.top > window.innerHeight - 70) {
                noteEl.remove();
                triggerJudgment('MISS');
            }
        });

        // Selesai Musik
        if (elapsedTime >= 53000) {
            endGame();
        }
    }, 50);
}

function spawnNoteDOM(laneIndex) {
    const lanes = document.querySelectorAll('.lane');
    if (!lanes[laneIndex]) return;

    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    lanes[laneIndex].appendChild(noteEl);
}

// --- AKURASI DAN SENTUHAN TOMBOL ---
function hitLane(laneIndex) {
    if (!isPlaying) return;

    const lanes = document.querySelectorAll('.lane');
    const currentLane = lanes[laneIndex];
    if (!currentLane) return;

    const activeNotes = currentLane.querySelectorAll('.note');

    if (activeNotes.length === 0) {
        triggerJudgment('MISS');
        return;
    }

    const targetNote = activeNotes[0];
    const heartKey = currentLane.querySelector('.heart-key');

    if (!targetNote || !heartKey) return;

    const noteRect = targetNote.getBoundingClientRect();
    const heartRect = heartKey.getBoundingClientRect();

    const noteCenter = noteRect.top + (noteRect.height / 2);
    const heartCenter = heartRect.top + (heartRect.height / 2);
    const distance = Math.abs(noteCenter - heartCenter);

    if (distance <= 50) {
        targetNote.remove();
        triggerJudgment('PERFECT');
    } else if (distance <= 100) {
        targetNote.remove();
        triggerJudgment('GOOD');
    } else {
        targetNote.remove();
        triggerJudgment('MISS');
    }
}

// --- SISTEM PENILAIAN & BATAS 5 MISS ---
function triggerJudgment(type) {
    const el = document.getElementById('judgment-text');
    if (el) {
        el.innerText = type;
        el.style.opacity = '1';
        setTimeout(() => { el.style.opacity = '0'; }, 300);
    }
    
    if (type === 'PERFECT') {
        if (el) el.style.color = '#ff5e97';
        score += 1000;
        combo++;
        perfectCount++;
    } else if (type === 'GOOD') {
        if (el) el.style.color = '#ffb800';
        score += 500;
        combo++;
        goodCount++;
    } else { // MISS
        if (el) el.style.color = '#888888';
        combo = 0;
        missCount++;

        // BATAS MAX MISS = 5
        if (missCount >= 5) {
            endGame();
            return;
        }
    }

    updateHUD();
}

function updateHUD() {
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    if (scoreEl) scoreEl.innerText = score.toLocaleString();
    if (comboEl) comboEl.innerText = combo;
}

// --- LAYAR RESULT / GAME OVER ---
function endGame() {
    isPlaying = false;
    clearInterval(gameInterval);
    bgm.pause();

    document.getElementById('game-screen').style.display = 'none';
    
    document.getElementById('res-score').innerText = score.toLocaleString();
    document.getElementById('res-perfect').innerText = perfectCount;
    document.getElementById('res-good').innerText = goodCount;
    document.getElementById('res-miss').innerText = missCount;
    
    const inputEl = document.getElementById('username-input');
    if (inputEl) inputEl.value = '';
    
    document.getElementById('result-screen').style.display = 'flex';
}

// --- SIMPAN SKOR KE FIREBASE ---
function saveScoreAndExit() {
    const inputEl = document.getElementById('username-input');
    const username = (inputEl && inputEl.value.trim() !== "") ? inputEl.value.trim() : "Player";

    try {
        firebase.database().ref('leaderboard').push({
            username: username,
            score: score,
            perfect: perfectCount,
            good: goodCount,
            miss: missCount,
            timestamp: Date.now()
        }).then(() => {
            document.getElementById('result-screen').style.display = 'none';
            toggleLeaderboard(true);
        }).catch(() => {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });
    } catch(e) {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }
}

// --- LEADERBOARD MODAL TOGGLE ---
function toggleLeaderboard(show) {
    const modal = document.getElementById('leaderboard-modal');
    document.getElementById('main-menu').style.display = 'none';
    modal.style.display = show ? 'flex' : 'none';

    if (!show) {
        document.getElementById('main-menu').style.display = 'flex';
        return;
    }

    // Ambil Data Leaderboard dari Firebase
    const listEl = document.getElementById('leaderboard-list');
    listEl.innerHTML = "<p style='text-align:center;'>Loading...</p>";

    try {
        firebase.database().ref('leaderboard').orderByChild('score').limitToLast(10).once('value', (snapshot) => {
            let html = "";
            let dataArr = [];
            snapshot.forEach(child => { dataArr.push(child.val()); });
            dataArr.reverse(); // Urutkan skor tertinggi

            if (dataArr.length === 0) {
                html = "<p style='text-align:center;'>Belum ada skor tersimpan.</p>";
            } else {
                dataArr.forEach((item, index) => {
                    html += `
                        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">
                            <span>#${index+1} <b>${item.username}</b></span>
                            <span style="color:var(--accent-color); font-weight:bold;">${item.score.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            listEl.innerHTML = html;
        });
    } catch(e) {
        listEl.innerHTML = "<p style='text-align:center;'>Gagal memuat leaderboard.</p>";
    }
}
</script>
</body>
</html>
